name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build-macos:
    runs-on: macos-latest
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Build macOS app
        run: |
          pyinstaller \
            --name "QuinkGL Desktop" \
            --windowed \
            --add-data "src/quinkgl_desktop/resources:quinkgl_desktop/resources" \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            --osx-bundle-identifier com.quinkgl.desktop \
            src/quinkgl_desktop/main.py
      - name: Zip macOS app
        run: |
          cd dist
          zip -r "QuinkGL-Desktop-macos.zip" "QuinkGL Desktop.app"
      - uses: actions/upload-artifact@v4
        with:
          name: QuinkGL-Desktop-macos
          path: dist/QuinkGL-Desktop-macos.zip

  build-windows:
    runs-on: windows-latest
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Build Windows exe
        run: |
          pyinstaller `
            --name "quinkgl-desktop" `
            --windowed `
            --add-data "src/quinkgl_desktop/resources;quinkgl_desktop/resources" `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import PySide6.QtWidgets `
            src/quinkgl_desktop/main.py
      - name: Zip Windows build
        run: |
          cd dist
          Compress-Archive -Path "quinkgl-desktop" -DestinationPath "QuinkGL-Desktop-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: QuinkGL-Desktop-windows
          path: dist/QuinkGL-Desktop-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Build Linux executable
        run: |
          pyinstaller \
            --name "quinkgl-desktop" \
            --windowed \
            --add-data "src/quinkgl_desktop/resources:quinkgl_desktop/resources" \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            src/quinkgl_desktop/main.py
      - name: Tar Linux build
        run: |
          cd dist
          tar czf "QuinkGL-Desktop-linux.tar.gz" quinkgl-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: QuinkGL-Desktop-linux
          path: dist/QuinkGL-Desktop-linux.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
