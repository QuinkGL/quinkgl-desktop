[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quinkgl-desktop"
version = "0.1.0"
description = "Desktop launcher for QuinkGL peers"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
build = [
  "pyinstaller>=6",
]

[project.scripts]
quinkgl-desktop = "quinkgl_desktop.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
